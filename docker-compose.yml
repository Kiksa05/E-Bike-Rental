services:
  mysql:
    image: mysql:8.4
    container_name: ecoride-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ecoride-rental
    ports:
      # 3307 because XAMPP already uses 3306 on this machine.
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/demo.sql:/docker-entrypoint-initdb.d/demo.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 30

  backend:
    build: .
    container_name: ecoride-backend
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/ecoride-rental
      SPRING_DATASOURCE_PASSWORD: root
      JWT_SECRET: ${JWT_SECRET:?Copy .env.example to .env and set JWT_SECRET}
    ports:
      - "127.0.0.1:8081:8080"

  frontend:
    build:
      context: ./frontend
      args:
        # The browser calls the backend, so this is the host port, not a container name.
        REACT_APP_BASE_URL: http://localhost:8081
    container_name: ecoride-frontend
    depends_on:
      - backend
    ports:
      - "127.0.0.1:3000:80"

volumes:
  mysql_data:
